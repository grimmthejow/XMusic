def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def getSecret = { key ->
    if (localProps.getProperty(key) != null) return localProps.getProperty(key)
    else if (System.getenv(key) != null) return System.getenv(key)
    else throw new GradleException("$key is missing.")
}

android {
    namespace = "com.xapps.media.xmusic"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.xapps.media.xmusic"
        minSdk = 26
        targetSdk = 37
        versionCode = 40
        versionName = '0.40 Alpha'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    sourceSets {
        main {
            manifest.srcFile("src/main/AndroidManifest.xml")
            java.srcDirs += "src/extra/java"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def base64Key = getSecret("KEYSTORE_BASE64")
            def tmpFile = file("build/tmp_keystore.jks")
            tmpFile.parentFile.mkdirs()
            tmpFile.bytes = Base64.decoder.decode(base64Key)

            storeFile = tmpFile
            storePassword = getSecret("KEYSTORE_PASSWORD")
            keyAlias = getSecret("KEY_ALIAS")
            keyPassword = getSecret("ALIAS_PASSWORD")
        }

        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        preview {
            initWith(release)
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.debug
        }

        preview {
            initWith(release)
            matchingFallbacks = ["release", "debug"]
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.preview
        }

        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
        explainIssues = true
        htmlReport = true
    }

    splits {
        abi {
            enable = true
            reset()
            include("armeabi-v7a", "arm64-v8a", "x86_64")
            universalApk = true
        }
    }
}

